<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso Completo de Inversión en Bolsa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0a3d62;
            --secondary: #1e5f8b;
            --accent: #f39c12;
            --success: #27ae60;
            --danger: #e74c3c;
            --bg-light: #f8f9fa;
            --bg-dark: #0d1b2a;
            --text-dark: #1b2631;
            --text-light: #f8f9fa;
            --border: #e0e6ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b3a52 100%);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--primary) 100%);
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--accent);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 60%;
            height: 200%;
            background: radial-gradient(circle, rgba(243, 156, 18, 0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: var(--text-light);
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
            text-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            letter-spacing: -1px;
        }

        .header p {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: rgba(248, 249, 250, 0.9);
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }

        .ticker {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 0.8rem;
            margin-top: 2rem;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .ticker-item.up { color: var(--success); }
        .ticker-item.down { color: var(--danger); }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Progress Bar */
        .progress-container {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 968px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar */
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 2rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
        }

        .sidebar h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .module-list {
            list-style: none;
        }

        .module-item {
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .module-item:hover {
            background: var(--bg-light);
            border-left-color: var(--accent);
            transform: translateX(5px);
        }

        .module-item.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-left-color: var(--accent);
            font-weight: 600;
        }

        .module-number {
            background: var(--accent);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .module-item.active .module-number {
            background: white;
            color: var(--primary);
        }

        .module-item.completed {
            opacity: 0.7;
        }

        .module-item.completed::after {
            content: '✓';
            color: var(--success);
            font-weight: bold;
            margin-left: auto;
        }

        /* Content Area */
        .content {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            min-height: 600px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .content h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--secondary);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }

        .content h4 {
            font-size: 1.3rem;
            color: var(--text-dark);
            margin-top: 2rem;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .content p {
            margin-bottom: 1.2rem;
            color: #4a5568;
            font-size: 1.05rem;
        }

        .content ul {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        .content li {
            margin-bottom: 0.8rem;
            color: #4a5568;
            position: relative;
            padding-left: 0.5rem;
        }

        .content li::marker {
            color: var(--accent);
        }

        .content strong {
            color: var(--primary);
            font-weight: 600;
        }

        /* Info Boxes */
        .info-box {
            background: linear-gradient(135deg, #e8f4fd 0%, #d4e9f7 100%);
            border-left: 4px solid var(--secondary);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 8px;
        }

        .warning-box {
            background: linear-gradient(135deg, #fff4e6 0%, #ffe8cc 100%);
            border-left: 4px solid var(--accent);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 8px;
        }

        .success-box {
            background: linear-gradient(135deg, #e8f8f0 0%, #d1f2e0 100%);
            border-left: 4px solid var(--success);
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 8px;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border);
            gap: 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Work Sans', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(10, 61, 98, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Quiz Section */
        .quiz-container {
            background: var(--bg-light);
            padding: 2rem;
            border-radius: 12px;
            margin-top: 2rem;
        }

        .quiz-question {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .quiz-option {
            padding: 1rem 1.5rem;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .quiz-option.incorrect {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* Dark mode toggle */
        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            font-size: 1.5rem;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-light);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Curso Completo de Inversión en Bolsa</h1>
        <p>Aprende a invertir de forma inteligente y construye tu futuro financiero</p>
        <div class="ticker">
            <div class="ticker-item up">
                <span>📈 S&P 500:</span>
                <strong>+1.2%</strong>
            </div>
            <div class="ticker-item down">
                <span>📉 NASDAQ:</span>
                <strong>-0.3%</strong>
            </div>
            <div class="ticker-item up">
                <span>💰 DOW:</span>
                <strong>+0.8%</strong>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong style="font-size: 1.1rem; color: var(--primary);">Tu Progreso</strong>
                    <p style="margin: 0; color: #666; font-size: 0.9rem;">Módulo <span id="current-module">1</span> de 14</p>
                </div>
                <div style="font-size: 2rem; color: var(--accent);">
                    <span id="progress-percent">0</span>%
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="layout">
            <aside class="sidebar">
                <h2>Módulos del Curso</h2>
                <ul class="module-list" id="module-list">
                    <!-- Modules will be inserted here by JavaScript -->
                </ul>
            </aside>

            <main class="content" id="content">
                <!-- Content will be inserted here by JavaScript -->
            </main>
        </div>
    </div>

    <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">🌙</button>

    <script>
        const modules = [
            {
                id: 1,
                title: "Fundamentos y Conceptos Básicos",
                content: `
                    <h2>Módulo 1: Fundamentos y Conceptos Básicos</h2>
                    
                    <h3>1.1 ¿Qué es la bolsa de valores?</h3>
                    <p>La bolsa de valores es un mercado organizado donde se compran y venden acciones de empresas públicas, bonos y otros instrumentos financieros. Funciona como un punto de encuentro entre empresas que necesitan financiamiento y personas o instituciones que buscan invertir su dinero.</p>
                    
                    <div class="info-box">
                        <strong>💡 Dato clave:</strong> La bolsa permite que cualquier persona pueda convertirse en copropietario de grandes empresas comprando acciones.
                    </div>
                    
                    <h3>1.2 Conceptos fundamentales</h3>
                    <ul>
                        <li><strong>Acción:</strong> Representa una parte del capital de una empresa. Al comprar acciones te conviertes en copropietario.</li>
                        <li><strong>Índice bursátil:</strong> Mide el rendimiento de un grupo de acciones (S&P 500, Nasdaq, Dow Jones).</li>
                        <li><strong>Dividendos:</strong> Pagos periódicos que algunas empresas hacen a sus accionistas.</li>
                        <li><strong>Capitalización de mercado:</strong> Valor total de una empresa en bolsa (precio de acción × número de acciones).</li>
                        <li><strong>Bull Market:</strong> Mercado alcista, los precios suben.</li>
                        <li><strong>Bear Market:</strong> Mercado bajista, los precios caen.</li>
                        <li><strong>Volatilidad:</strong> Medida de cuánto fluctúa el precio de un activo.</li>
                    </ul>
                    
                    <h3>1.3 Tipos de activos financieros</h3>
                    <ul>
                        <li><strong>Acciones:</strong> Renta variable, mayor riesgo y potencial de retorno.</li>
                        <li><strong>Bonos:</strong> Renta fija, préstamos a empresas o gobiernos.</li>
                        <li><strong>ETFs</strong> (Exchange Traded Funds): Fondos que replican índices y cotizan en bolsa.</li>
                        <li><strong>Fondos mutuos:</strong> Carteras administradas profesionalmente.</li>
                        <li><strong>REITs:</strong> Fondos de inversión en bienes raíces.</li>
                    </ul>
                    
                    <h3>1.4 Cómo funcionan las órdenes</h3>
                    <ul>
                        <li><strong>Orden de mercado:</strong> Se ejecuta al precio actual inmediatamente.</li>
                        <li><strong>Orden limitada:</strong> Se ejecuta solo al precio que especificas o mejor.</li>
                        <li><strong>Stop loss:</strong> Orden automática para vender si el precio cae a cierto nivel.</li>
                        <li><strong>Take profit:</strong> Orden para vender cuando se alcanza una ganancia objetivo.</li>
                    </ul>
                    
                    <div class="success-box">
                        <strong>✅ Resumen clave:</strong> Entender estos conceptos básicos es fundamental antes de realizar tu primera inversión. Tómate el tiempo necesario para familiarizarte con cada término.
                    </div>
                `
            },
            {
                id: 2,
                title: "Preparación para Invertir",
                content: `
                    <h2>Módulo 2: Preparación para Invertir</h2>
                    
                    <h3>2.1 Definir objetivos financieros</h3>
                    <p>Antes de invertir, debes preguntarte: ¿Para qué estoy invirtiendo? ¿Cuándo necesitaré el dinero? ¿Cuánto riesgo puedo tolerar? Los objetivos comunes incluyen jubilación, compra de vivienda, educación de hijos o generar ingresos pasivos.</p>
                    
                    <div class="warning-box">
                        <strong>⚠️ Importante:</strong> Nunca inviertas sin tener claros tus objetivos. Esto determinará tu estrategia de inversión.
                    </div>
                    
                    <h3>2.2 Gestión del riesgo y perfil de inversor</h3>
                    <ul>
                        <li><strong>Conservador:</strong> Prioriza preservar el capital, acepta menor rentabilidad.</li>
                        <li><strong>Moderado:</strong> Busca equilibrio entre riesgo y retorno.</li>
                        <li><strong>Agresivo:</strong> Acepta alta volatilidad buscando mayores ganancias.</li>
                    </ul>
                    <p>Tu perfil depende de tu edad, situación financiera, conocimientos y tolerancia psicológica al riesgo.</p>
                    
                    <h3>2.3 Crear un fondo de emergencia</h3>
                    <p>Antes de invertir en bolsa, asegúrate de tener ahorrado entre 3 y 6 meses de gastos en una cuenta líquida y segura. La bolsa no es lugar para dinero que podrías necesitar en el corto plazo.</p>
                    
                    <div class="info-box">
                        <strong>💡 Regla de oro:</strong> Primero el fondo de emergencia, luego las inversiones. Esta es tu red de seguridad financiera.
                    </div>
                    
                    <h3>2.4 Elegir un broker</h3>
                    <p>Investiga comisiones, plataformas disponibles, tipos de activos ofrecidos y regulaciones. Brokers populares incluyen Interactive Brokers, TD Ameritrade, Fidelity, Charles Schwab, entre otros. Considera también brokers locales regulados en tu país.</p>
                    
                    <div class="success-box">
                        <strong>✅ Checklist de preparación:</strong><br>
                        ☑ Objetivos definidos<br>
                        ☑ Perfil de riesgo identificado<br>
                        ☑ Fondo de emergencia establecido<br>
                        ☑ Broker seleccionado y cuenta abierta
                    </div>
                `
            },
            {
                id: 3,
                title: "Estrategias de Inversión Básicas",
                content: `
                    <h2>Módulo 3: Estrategias de Inversión Básicas</h2>
                    
                    <h3>3.1 Inversión pasiva (Buy and Hold)</h3>
                    <p>Consiste en comprar activos y mantenerlos a largo plazo, típicamente 5 años o más. Se basa en la premisa de que los mercados tienden a subir con el tiempo. Es ideal para principiantes porque requiere menos tiempo y conocimiento técnico.</p>
                    
                    <h3>3.2 Diversificación</h3>
                    <p>No pongas todos tus huevos en una canasta. Distribuye tu capital entre diferentes sectores, geografías y tipos de activos. La diversificación reduce el riesgo sin necesariamente sacrificar retornos.</p>
                    
                    <div class="info-box">
                        <strong>💡 Ejemplo práctico:</strong> En lugar de invertir $10,000 en una sola empresa, distribúyelos entre 10-15 empresas de diferentes sectores.
                    </div>
                    
                    <h3>3.3 Dollar Cost Averaging (DCA)</h3>
                    <p>Invierte cantidades fijas de dinero en intervalos regulares sin importar el precio. Esta estrategia reduce el impacto de la volatilidad y elimina la necesidad de timing perfecto del mercado.</p>
                    
                    <h4>Ventajas del DCA:</h4>
                    <ul>
                        <li>Elimina la emoción de decidir "cuándo comprar"</li>
                        <li>Promedias el precio de entrada</li>
                        <li>Puedes empezar con poco capital</li>
                        <li>Construye disciplina de ahorro</li>
                    </ul>
                    
                    <h3>3.4 Inversión en índices</h3>
                    <p>Los ETFs que replican índices como el S&P 500 ofrecen diversificación instantánea y bajas comisiones. Históricamente han superado a la mayoría de gestores activos en el largo plazo.</p>
                    
                    <div class="warning-box">
                        <strong>⚠️ Consejo de Warren Buffett:</strong> "Para la mayoría de la gente, la mejor manera de invertir en acciones es a través de un fondo indexado de bajo costo."
                    </div>
                    
                    <div class="success-box">
                        <strong>✅ Estrategia recomendada para principiantes:</strong><br>
                        Combina DCA + Inversión en índices + Diversificación = Fórmula sólida para empezar
                    </div>
                `
            },
            {
                id: 4,
                title: "Análisis Fundamental",
                content: `
                    <h2>Módulo 4: Análisis Fundamental</h2>
                    
                    <h3>4.1 Estados financieros básicos</h3>
                    <ul>
                        <li><strong>Balance general:</strong> Muestra activos, pasivos y patrimonio en un momento específico.</li>
                        <li><strong>Estado de resultados:</strong> Ingresos, costos y ganancias durante un período.</li>
                        <li><strong>Flujo de caja:</strong> Movimientos de efectivo, indica la salud financiera real.</li>
                    </ul>
                    
                    <h3>4.2 Ratios financieros clave</h3>
                    
                    <h4>P/E Ratio (Precio/Ganancias)</h4>
                    <p>Compara el precio de la acción con las ganancias por acción. Un P/E alto puede indicar que la acción está cara o que el mercado espera crecimiento futuro.</p>
                    
                    <h4>ROE (Return on Equity)</h4>
                    <p>Mide la rentabilidad sobre el capital de los accionistas. Indica qué tan eficientemente la empresa usa el dinero de sus inversores.</p>
                    
                    <h4>Debt to Equity</h4>
                    <p>Indica el nivel de endeudamiento relativo al patrimonio. Demasiada deuda puede ser riesgosa, especialmente en tiempos difíciles.</p>
                    
                    <h4>EPS (Earnings Per Share)</h4>
                    <p>Ganancias divididas por número de acciones. Indica cuánto gana la empresa por cada acción.</p>
                    
                    <h4>Dividend Yield</h4>
                    <p>Dividendo anual dividido por el precio de la acción. Muestra el retorno que recibes solo por dividendos.</p>
                    
                    <div class="info-box">
                        <strong>💡 Tip profesional:</strong> No uses un solo ratio de forma aislada. Compara múltiples métricas y analiza tendencias en el tiempo.
                    </div>
                    
                    <h3>4.3 Análisis cualitativo</h3>
                    <p>Evalúa factores no numéricos como la calidad del equipo directivo, ventajas competitivas (moats), posición en la industria, innovación, reputación de marca y tendencias del sector.</p>
                    
                    <h3>4.4 Valoración de empresas</h3>
                    <p>Métodos como el DCF (Discounted Cash Flow) proyectan flujos de caja futuros y los descuentan al presente para determinar el valor intrínseco de una empresa. Si el precio de mercado está por debajo del valor intrínseco, puede ser una oportunidad de compra.</p>
                    
                    <div class="success-box">
                        <strong>✅ Proceso de análisis fundamental:</strong><br>
                        1. Revisa estados financieros<br>
                        2. Calcula ratios clave<br>
                        3. Evalúa factores cualitativos<br>
                        4. Determina valor intrínseco<br>
                        5. Compara con precio de mercado
                    </div>
                `
            },
            {
                id: 5,
                title: "Análisis Técnico",

                    <h2>Módulo 5: Análisis Técnico</h2>
                    
                    <h3>5.1 Lectura de gráficos</h3>
                    
                    <h4>Gráfico de velas (candlesticks)</h4>
                    <p>Muestra apertura, cierre, máximo y mínimo en cada período. Cada vela cuenta una historia sobre la batalla entre compradores y vendedores.</p>
                    
                    <h4>Líneas de tendencia</h4>
                    <p>Conectan mínimos (tendencia alcista) o máximos (tendencia bajista). Ayudan a identificar la dirección general del mercado.</p>
                    
                    <h4>Soportes y resistencias</h4>
                    <p>Niveles de precio donde históricamente el activo ha tenido dificultad para bajar o subir. Son zonas psicológicas importantes.</p>
                    
                    <h3>5.2 Indicadores técnicos</h3>
                    
                    <h4>Medias móviles</h4>
                    <p>Suavizan el precio mostrando tendencias (MA 50, MA 200). El cruce de medias puede señalar cambios de tendencia.</p>
                    
                    <h4>RSI (Relative Strength Index)</h4>
                    <p>Indica condiciones de sobrecompra (>70) o sobreventa (<30). Valores extremos pueden señalar reversión.</p>
                    
                    <h4>MACD</h4>
                    <p>Muestra cambios en momentum y posibles puntos de entrada/salida. El cruce de líneas genera señales de compra/venta.</p>
                    
                    <h4>Bandas de Bollinger</h4>
                    <p>Miden volatilidad y extremos de precio. Cuando el precio toca las bandas, puede indicar condición de sobrecompra/sobreventa.</p>
                    
                    <h4>Volumen</h4>
                    <p>Confirma la fuerza de movimientos de precio. Un movimiento con alto volumen es más significativo que uno con bajo volumen.</p>
                    
                    <div class="info-box">
                        <strong>💡 Concepto clave:</strong> Los indicadores técnicos son herramientas de probabilidad, no certeza. Ningún indicador funciona el 100% del tiempo.
                    </div>
                    
                    <h3>5.3 Patrones gráficos</h3>
                    <ul>
                        <li><strong>Hombro-cabeza-hombro:</strong> Patrón de reversión bajista.</li>
                        <li><strong>Doble techo/suelo:</strong> Señales de cambio de tendencia.</li>
                        <li><strong>Triángulos:</strong> Consolidación antes de ruptura.</li>
                        <li><strong>Banderas y banderines:</strong> Continuación de tendencia.</li>
                    </ul>
                    
                    <h3>5.4 Limitaciones del análisis técnico</h3>
                    <p>El análisis técnico asume que toda la información está en el precio y que la historia se repite. Sin embargo, no considera fundamentos de la empresa y puede generar señales falsas. Es mejor usarlo complementando el análisis fundamental.</p>
                    
                    <div class="warning-box">
                        <strong>⚠️ Advertencia importante:</strong> El análisis técnico no predice el futuro. Solo ayuda a identificar probabilidades basadas en patrones históricos.
                    </div>

        let currentModuleIndex = 0;
        const completedModules = new Set();

        function renderModuleList() {
            const moduleList = document.getElementById('module-list');
            moduleList.innerHTML = modules.map((module, index) => `
                <li class="module-item ${index === currentModuleIndex ? 'active' : ''} ${completedModules.has(index) ? 'completed' : ''}" 
                    onclick="loadModule(${index})">
                    <span class="module-number">${module.id}</span>
                    <span>${module.title}</span>
                </li>
            `).join('');
        }

        function loadModule(index) {
            if (index < 0 || index >= modules.length) return;
            
            currentModuleIndex = index;
            const module = modules[index];
            
            document.getElementById('content').innerHTML = module.content + `
                <div class="nav-buttons">
                    <button class="btn btn-secondary" onclick="loadModule(${index - 1})" ${index === 0 ? 'disabled' : ''}>
                        ← Anterior
                    </button>
                    <button class="btn btn-primary" onclick="completeModule()">
                        ${index === modules.length - 1 ? '✓ Finalizar Curso' : 'Marcar como completado →'}
                    </button>
                </div>
            `;
            
            renderModuleList();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function completeModule() {
            completedModules.add(currentModuleIndex);
            
            if (currentModuleIndex < modules.length - 1) {
                loadModule(currentModuleIndex + 1);
            } else {
                alert('🎉 ¡Felicitaciones! Has completado el curso completo de inversión en bolsa. ¡Ahora es momento de poner en práctica lo aprendido!');
            }
            
            updateProgress();
        }

        function updateProgress() {
            const progress = Math.round((completedModules.size / modules.length) * 100);
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-percent').textContent = progress;
            document.getElementById('current-module').textContent = currentModuleIndex + 1;
        }

        // Theme toggle
        let isDark = true;
        document.getElementById('theme-toggle').addEventListener('click', function() {
            isDark = !isDark;
            if (isDark) {
                document.body.style.background = 'linear-gradient(135deg, #0d1b2a 0%, #1b3a52 100%)';
                this.textContent = '🌙';
            } else {
                document.body.style.background = 'linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%)';
                this.textContent = '☀️';
            }
        });

        // Initialize
        loadModule(0);

        // Animate ticker
        setInterval(() => {
            const items = document.querySelectorAll('.ticker-item');
            items.forEach(item => {
                const change = (Math.random() * 2 - 1).toFixed(1);
                const value = item.querySelector('strong');
                value.textContent = (change >= 0 ? '+' : '') + change + '%';
                item.className = 'ticker-item ' + (change >= 0 ? 'up' : 'down');
            });
        }, 5000);
    </script>
